aid: vilya
name: Vilya
description: >-
  Vilya is a computational drug-design biotechnology company pioneering the de novo
  design of macrocycles — entirely new therapeutic molecules that do not exist in
  nature. Spun out of the Institute for Protein Design and built on Nobel Prize-winning
  computational protein-design research from scientific founder Dr. David Baker, Vilya
  uses AI-driven generative models to generate, predict, and validate novel, chemically
  diverse macrocycles in silico. Its pipeline advances orally bioavailable macrocycles
  that aim to combine the target selectivity of biologics with the convenience of small-
  molecule pills, opening previously untreatable disease areas across oncology and
  immunology (including an integrin alpha4beta7 program for IBD). Vilya is a private
  therapeutics company; it publishes no public developer API, SDKs, or developer portal.
